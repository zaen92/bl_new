name: STEP 2 AI generation mock tests

on:
  push:
    branches: [codex/step2-ai-generation]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: step2-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: 'true'
  VITE_USE_EMULATORS: 'true'
  VITE_FIREBASE_PROJECT_ID: demo-jaeinit
  VITE_FIREBASE_API_KEY: demo-key
  VITE_FIREBASE_AUTH_DOMAIN: demo-jaeinit.firebaseapp.com
  VITE_FIREBASE_APP_ID: demo-app

jobs:
  step2:
    name: AI credits, Storage, regression and browser E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout the requested branch commit
        id: checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up pinned Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json

      - name: Set up pinned Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21.0.13+9'

      - name: Use runner-local caches and no production credentials
        run: |
          echo "FIREBASE_EMULATORS_PATH=$RUNNER_TEMP/firebase-emulators" >> "$GITHUB_ENV"
          echo "XDG_CONFIG_HOME=$RUNNER_TEMP/firebase-cli-config" >> "$GITHUB_ENV"
          echo "PLAYWRIGHT_BROWSERS_PATH=$RUNNER_TEMP/playwright-browsers" >> "$GITHUB_ENV"
          node --input-type=module <<'NODE'
          if (process.env.VITE_FIREBASE_PROJECT_ID !== 'demo-jaeinit' || process.env.VITE_USE_EMULATORS !== 'true') throw new Error('Emulator-only configuration required');
          if (process.env.GOOGLE_APPLICATION_CREDENTIALS) throw new Error('Production service account must not be provided to this workflow');
          NODE

      - name: Install both locked dependency trees
        id: deps
        run: |
          npm ci --no-audit --no-fund
          npm --prefix functions ci --no-audit --no-fund

      - name: Check CI log redaction and result accounting
        id: ci-tools
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: node scripts/ci-run.mjs ci-tools node --test --test-reporter=tap tests/ci/ci-report.test.mjs

      - name: Restore official Firestore/Storage artifacts cache
        id: emulator-cache
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ${{ env.FIREBASE_EMULATORS_PATH }}/cloud-firestore-emulator-*.jar
            ${{ env.FIREBASE_EMULATORS_PATH }}/cloud-storage-rules-*.jar
          key: ${{ runner.os }}-step2-emulators-${{ hashFiles('package-lock.json') }}

      - name: Prepare and verify the official Firestore/Storage Emulators
        id: prepare
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: node scripts/ci-run.mjs prepare npm run emulators:prepare -- --storage

      - name: Save only the verified official artifact
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' && steps.emulator-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ${{ env.FIREBASE_EMULATORS_PATH }}/cloud-firestore-emulator-*.jar
            ${{ env.FIREBASE_EMULATORS_PATH }}/cloud-storage-rules-*.jar
          key: ${{ runner.os }}-step2-emulators-${{ hashFiles('package-lock.json') }}

      - name: Create an ephemeral Emulator-only HMAC key
        id: test-key
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: |
          node --input-type=module <<'NODE'
          import {randomBytes} from 'node:crypto';
          import {writeFileSync} from 'node:fs';
          writeFileSync('functions/.secret.local', 'SIGNUP_IDENTITY_HMAC_KEY='+randomBytes(32).toString('hex')+'\nCLAUDE_API_KEY=ci-mock-not-a-real-key\nNAVER_CLIENT_ID=ci-mock-not-a-real-id\nNAVER_CLIENT_SECRET=ci-mock-not-a-real-secret\n', {mode:0o600,flag:'wx'});
          writeFileSync('functions/.env.local', 'AI_PROVIDER_MODE=mock\nAI_MOCK_DELAY_MS=0\n');
          NODE

      # Prioritize the previously unrun 4 security + 7 server tests.
      # npm test runs 47 real Emulator/unit cases; required regressions remain enabled.
      - name: STEP 1 regression plus STEP 2 credits/photos integration
        id: integration
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' && steps.test-key.outcome == 'success' }}
        run: node scripts/ci-run.mjs step2-integration npm test

      - name: Build
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: node scripts/ci-run.mjs build npm run build

      - name: Verify current official Anthropic model, tool, streaming and pricing docs
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: node scripts/ci-run.mjs official-docs node scripts/verify-anthropic-docs.mjs

      - name: Provider protocol and personalization unit tests (mock HTTP only)
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: node scripts/ci-run.mjs step2-unit npm run test:step2:unit

      - name: Seven unit tests
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: node scripts/ci-run.mjs unit npm run test:unit

      - name: Install the locked Playwright Chromium and OS dependencies
        id: browser
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: |
          ./node_modules/.bin/playwright install --with-deps chromium
          node --input-type=module <<'NODE'
          import {chromium} from '@playwright/test';
          import {appendFileSync} from 'node:fs';
          appendFileSync(process.env.GITHUB_ENV, 'CHROMIUM_PATH='+chromium.executablePath()+'\n');
          NODE

      - name: Four UI regression tests
        if: ${{ !cancelled() && steps.browser.outcome == 'success' }}
        run: node scripts/ci-run.mjs ui npm run test:ui

      # Independent of Firestore readiness; an external Google SDK failure stays
      # a failed Auth step, never a skipped assertion or continue-on-error pass.
      - name: Email and Google Auth Emulator login
        if: ${{ !cancelled() && steps.browser.outcome == 'success' }}
        run: node scripts/ci-run.mjs auth npm run test:auth

      - name: STEP 2 browser E2E with real Emulators and explicit mock provider
        if: ${{ !cancelled() && steps.browser.outcome == 'success' && steps.prepare.outcome == 'success' && steps.test-key.outcome == 'success' }}
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync,writeFileSync} from 'node:fs';
          writeFileSync('functions/.env.local',readFileSync('functions/.env.local','utf8').replace('AI_MOCK_DELAY_MS=0','AI_MOCK_DELAY_MS=1200'));
          NODE
          node scripts/ci-run.mjs step2-e2e npm run test:step2:e2e

      - name: Publish explicit pass/fail/not-run evidence
        if: ${{ always() && steps.checkout.outcome == 'success' }}
        run: node scripts/ci-summary.mjs ci-tools prepare step2-integration build official-docs step2-unit unit ui auth step2-e2e

      - name: Upload sanitized test logs and numeric receipts only
        if: ${{ always() && steps.checkout.outcome == 'success' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: step2-test-evidence-${{ github.run_attempt }}
          path: |
            .local/ci-reports/*.log
            .local/ci-reports/*.json
          if-no-files-found: warn
          retention-days: 7

      - name: Remove the ephemeral secret
        if: ${{ always() && steps.checkout.outcome == 'success' }}
        run: rm -f functions/.secret.local functions/.env.local
